<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Talk Spinner</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* warm sunset / terracotta palette — distinct from the cosmic-purple younger set */
    --bg: #14201f;
    --bg2: #1b2e2c;
    --card: #233937;
    --card-light: #2e4744;
    --ink: #f5f0e8;
    --muted: #a9c2bd;
    --gold: #f4c95d;
    --gold-deep: #e0a93b;
    --coral: #ff8a6b;
    --rose: #f76e8e;
    --teal: #4fd1c5;
    --sage: #93d8a8;
    --sky: #6bb8d6;
    --shadow: rgba(5,15,14,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Sora', sans-serif;
    background:
      radial-gradient(circle at 12% 8%, rgba(255,138,107,0.16), transparent 45%),
      radial-gradient(circle at 88% 18%, rgba(79,209,197,0.14), transparent 45%),
      radial-gradient(circle at 50% 92%, rgba(247,110,142,0.10), transparent 50%),
      linear-gradient(160deg, var(--bg), var(--bg2));
    color: var(--ink); min-height: 100vh; padding: 24px; overflow-x: hidden;
  }
  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity:0.4; }
  .dot { position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold); opacity:.3; animation:drift 6s ease-in-out infinite; }
  @keyframes drift { 0%,100%{opacity:.15; transform:translateY(0);} 50%{opacity:.5; transform:translateY(-8px);} }

  .wrap { max-width: 720px; margin: 0 auto; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 14px; }
  h1 {
    font-size: 2.5rem; font-weight:700; letter-spacing:-0.5px;
    background: linear-gradient(90deg, var(--coral), var(--gold), var(--teal));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .tag { color: var(--muted); margin-top: 4px; font-weight:400; }

  .hud { display:flex; gap:12px; justify-content:center; margin:16px 0 22px; }
  .chip { background:var(--card); border-radius:16px; padding:10px 18px; display:flex; align-items:center; gap:8px; box-shadow:0 6px 16px var(--shadow); font-weight:500; }
  .chip .big { font-size:1.4rem; color:var(--gold); font-weight:700; }

  .card { background:var(--card); border-radius:24px; padding:26px; box-shadow:0 16px 40px var(--shadow); border:1px solid rgba(255,255,255,0.05); }

  h2 { font-size:1.3rem; margin-bottom:6px; text-align:center; font-weight:600; }
  .sub { color:var(--muted); margin-bottom:18px; line-height:1.5; text-align:center; font-weight:400; }

  .tabs { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
  .tab {
    background:var(--card-light); border:2px solid transparent; border-radius:12px;
    padding:8px 16px; cursor:pointer; font-family:inherit; font-weight:500; color:var(--muted);
    font-size:.92rem; transition:all .2s;
  }
  .tab:hover { transform:translateY(-2px); }
  .tab.active { border-color:var(--coral); color:var(--ink); background:var(--card); }

  .wheel-stage { position:relative; width:320px; height:320px; margin:10px auto 0; }
  .pointer {
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:18px solid transparent; border-right:18px solid transparent;
    border-top:30px solid var(--gold); z-index:5; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));
  }
  .wheel {
    width:320px; height:320px; border-radius:50%; position:relative;
    transition: transform 4.5s cubic-bezier(.17,.67,.2,1);
    box-shadow: 0 0 0 10px var(--card-light), 0 14px 40px var(--shadow);
  }
  .hub {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:54px; height:54px; border-radius:50%; z-index:4;
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));
    display:flex; align-items:center; justify-content:center; font-size:1.4rem;
    box-shadow:0 4px 12px rgba(0,0,0,.3); border:4px solid var(--card);
  }

  .btn {
    background:linear-gradient(135deg,var(--coral),var(--rose)); color:#fff; border:none;
    border-radius:16px; padding:15px 28px; font-family:inherit; font-size:1.05rem; font-weight:600;
    cursor:pointer; box-shadow:0 8px 20px rgba(255,138,107,0.3); transition:transform .15s, box-shadow .15s; width:100%;
  }
  .btn:hover { transform:translateY(-2px); box-shadow:0 12px 26px rgba(255,138,107,0.4); }
  .btn:active { transform:translateY(1px); }
  .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
  .btn.gold { background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#2a2008; box-shadow:0 8px 20px rgba(224,169,59,0.3); }
  .btn.ghost { background:transparent; border:2px solid var(--card-light); color:var(--muted); box-shadow:none; }

  .spin-area { text-align:center; margin-top:22px; }

  .result {
    margin-top:20px; background:var(--card-light); border-radius:18px; padding:24px;
    text-align:center; opacity:0; max-height:0; overflow:hidden; transition:all .5s ease;
  }
  .result.show { opacity:1; max-height:420px; padding:24px; }
  .result .emoji { font-size:2.4rem; display:block; margin-bottom:10px; }
  .result .question { font-family:'Caveat',cursive; font-size:2rem; color:var(--gold); line-height:1.25; margin-bottom:18px; }
  .result .actions { display:flex; gap:10px; }
  .result .actions .btn { font-size:.98rem; padding:12px 18px; }

  .toast {
    position:fixed; top:30px; left:50%; transform:translateX(-50%) translateY(-120px);
    background:linear-gradient(135deg,var(--gold),var(--gold-deep)); color:#2a2008;
    padding:14px 26px; border-radius:16px; font-weight:700; font-size:1.05rem;
    box-shadow:0 12px 30px rgba(0,0,0,.3); z-index:100; transition:transform .4s cubic-bezier(.2,1.4,.4,1);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .confetti { position:fixed; top:-10px; width:9px; height:13px; z-index:90; pointer-events:none; border-radius:2px; }

  .mini-note { font-size:.85rem; color:var(--muted); margin-top:14px; text-align:center; font-weight:400; }
</style>
</head>
<body>
<div class="grain" id="grain"></div>
<div class="toast" id="toast">Nice ✨</div>

<div class="wrap">
  <header>
    <h1>Real Talk Spinner</h1>
    <div class="tag">Spin it. Answer it. Pass anytime. 💬</div>
  </header>

  <div class="hud">
    <div class="chip"><span>💬</span><span class="big" id="answeredDisplay">0</span><span>shared</span></div>
    <div class="chip"><span>⭐</span><span class="big" id="pointsDisplay">0</span><span>pts</span></div>
  </div>

  <div class="card">
    <h2>Pick your zone 🎡</h2>
    <p class="sub">Choose a category, spin, and take it wherever feels right. No wrong answers, and you can always pass.</p>

    <div class="tabs" id="tabs">
      <button class="tab active" data-cat="warmup">☕ Warm-Up</button>
      <button class="tab" data-cat="feels">🌊 The Feels</button>
      <button class="tab" data-cat="identity">🧭 Who I Am</button>
      <button class="tab" data-cat="relationships">👥 People</button>
      <button class="tab" data-cat="future">🚀 Future Me</button>
    </div>

    <div class="wheel-stage">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="hub">🎡</div>
    </div>

    <div class="spin-area">
      <button class="btn gold" id="spinBtn" onclick="spin()">SPIN 🎯</button>
    </div>

    <div class="result" id="result">
      <span class="emoji" id="rEmoji">💬</span>
      <div class="question" id="rQuestion"></div>
      <div class="actions">
        <button class="btn ghost" onclick="reSpin()">↻ Pass / re-spin</button>
        <button class="btn" onclick="answered()">Shared it ✓</button>
      </div>
    </div>

    <p class="mini-note">Totally okay to skip any question — hitting "pass" is always allowed. 💛</p>
  </div>
</div>

<script>
  const categories = {
    warmup: {
      color1:'#4fd1c5', color2:'#6bb8d6',
      items:[
        {q:'What is something small that made you smile this week?', e:'☀️'},
        {q:'What is on your current playlist or on repeat right now?', e:'🎧'},
        {q:'What is a show, game, or app you are kind of obsessed with?', e:'📱'},
        {q:'Coffee, boba, energy drink, or none of the above?', e:'🧋'},
        {q:'What is your go-to comfort food?', e:'🍜'},
        {q:'If today had a weather report for your mood, what would it say?', e:'🌤️'},
        {q:'What is something you are looking forward to, big or small?', e:'📅'},
        {q:'Cats, dogs, or some unexpected third option?', e:'🐾'},
      ]
    },
    feels: {
      color1:'#f76e8e', color2:'#ff8a6b',
      items:[
        {q:'What helps you reset when you are stressed or overwhelmed?', e:'🌊'},
        {q:'Where in your body do you usually notice stress first?', e:'💗'},
        {q:'What is something that always lifts your mood, even a little?', e:'🎈'},
        {q:'When you are upset, do you want space, comfort, or distraction?', e:'🤔'},
        {q:'What is an emotion you find hard to talk about?', e:'💭'},
        {q:'What does a genuinely good day look like for you?', e:'✨'},
        {q:'How do you usually know when you need a break?', e:'⏸️'},
        {q:'What is one thing that has helped you get through a hard time?', e:'🌱'},
      ]
    },
    identity: {
      color1:'#f4c95d', color2:'#e0a93b',
      items:[
        {q:'What is something you genuinely like about yourself?', e:'⭐'},
        {q:'What is a value that matters a lot to you?', e:'🧭'},
        {q:'What is something you are good at that you do not brag about?', e:'🎯'},
        {q:'If your closest friend described you in 3 words, what would they say?', e:'💬'},
        {q:'What is something people get wrong about you?', e:'🔍'},
        {q:'What is a moment you felt really proud of yourself?', e:'🏆'},
        {q:'What is something you are working on or want to grow in?', e:'🌿'},
        {q:'What makes you feel most like yourself?', e:'🪞'},
      ]
    },
    relationships: {
      color1:'#93d8a8', color2:'#4fd1c5',
      items:[
        {q:'Who is someone you can really be yourself around?', e:'💛'},
        {q:'What does a good friend mean to you?', e:'🤝'},
        {q:'Who is someone you look up to, and why?', e:'🌟'},
        {q:'What is something you wish people understood about you?', e:'💭'},
        {q:'How do you like to be supported when things are rough?', e:'🫂'},
        {q:'What is a boundary you are proud of setting (or want to set)?', e:'🛡️'},
        {q:'Who makes you laugh the hardest?', e:'😂'},
        {q:'What is something kind someone did for you that stuck with you?', e:'💗'},
      ]
    },
    future: {
      color1:'#6bb8d6', color2:'#93d8a8',
      items:[
        {q:'If you could learn any skill instantly, what would it be?', e:'⚡'},
        {q:'What is something you hope is true for you in 5 years?', e:'🔮'},
        {q:'What would your ideal day look like if nothing held you back?', e:'🌅'},
        {q:'What is a dream you have not told many people about?', e:'💫'},
        {q:'If you could go anywhere in the world, where and why?', e:'🗺️'},
        {q:'What is something you want to try but feel nervous about?', e:'🪂'},
        {q:'What kind of person do you want to become?', e:'🌟'},
        {q:'What would you tell your younger self if you could?', e:'💌'},
      ]
    }
  };

  let currentCat = 'warmup';
  let points = 0, answeredCount = 0, spinning = false, rotation = 0;

  const wheel = document.getElementById('wheel');

  function buildWheel(){
    const items = categories[currentCat].items;
    const n = items.length;
    const seg = 360/n;
    const c1 = categories[currentCat].color1;
    const c2 = categories[currentCat].color2;
    let stops = [];
    for(let i=0;i<n;i++){
      const col = i%2===0 ? c1 : c2;
      stops.push(`${col} ${i*seg}deg ${(i+1)*seg}deg`);
    }
    wheel.style.background = `conic-gradient(${stops.join(',')})`;
    wheel.querySelectorAll('.seg-label').forEach(e=>e.remove());
    for(let i=0;i<n;i++){
      const lbl = document.createElement('div');
      lbl.className='seg-label';
      lbl.textContent = items[i].e;
      const angle = i*seg + seg/2;
      lbl.style.cssText = `position:absolute; top:50%; left:50%; font-size:1.4rem;
        transform: rotate(${angle}deg) translateY(-118px); transform-origin: center;`;
      wheel.appendChild(lbl);
    }
  }

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      if(spinning) return;
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      currentCat = t.dataset.cat;
      hideResult();
      buildWheel();
    });
  });

  function spin(){
    if(spinning) return;
    spinning = true;
    hideResult();
    document.getElementById('spinBtn').disabled = true;

    const items = categories[currentCat].items;
    const n = items.length;
    const seg = 360/n;
    const pick = Math.floor(Math.random()*n);
    const targetAngle = 360 - (pick*seg + seg/2);
    const spins = 5;
    rotation += spins*360 + (targetAngle - (rotation % 360));
    wheel.style.transform = `rotate(${rotation}deg)`;

    setTimeout(()=>{
      showResult(items[pick]);
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
    }, 4600);
  }

  function showResult(r){
    document.getElementById('rEmoji').textContent = r.e;
    document.getElementById('rQuestion').textContent = r.q;
    document.getElementById('result').classList.add('show');
    document.getElementById('spinBtn').textContent = 'Spin again 🎯';
  }
  function hideResult(){ document.getElementById('result').classList.remove('show'); }
  function reSpin(){ hideResult(); setTimeout(spin, 300); }

  function answered(){
    points += 10; answeredCount += 1;
    document.getElementById('pointsDisplay').textContent = points;
    document.getElementById('answeredDisplay').textContent = answeredCount;
    showToast('Love that ✨ +10');
    fireConfetti();
    hideResult();
    document.getElementById('spinBtn').textContent = 'SPIN 🎯';
  }

  let toastTimer;
  function showToast(msg){
    const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1700);
  }
  function fireConfetti(){
    const colors=['#f4c95d','#ff8a6b','#f76e8e','#4fd1c5','#93d8a8'];
    for(let i=0;i<50;i++){
      const c=document.createElement('div'); c.className='confetti';
      c.style.left=Math.random()*100+'vw';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.animation=`fall ${2+Math.random()*2}s linear forwards`;
      c.style.transform=`rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
    }
  }
  const sheet=document.createElement('style');
  sheet.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0;}}';
  document.head.appendChild(sheet);

  (function(){
    const box=document.getElementById('grain');
    for(let i=0;i<40;i++){
      const d=document.createElement('div'); d.className='dot';
      d.style.left=Math.random()*100+'%'; d.style.top=Math.random()*100+'%';
      d.style.animationDelay=Math.random()*6+'s';
      box.appendChild(d);
    }
  })();

  buildWheel();
</script>
</body>
</html>
